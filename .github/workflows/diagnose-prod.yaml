
name: Diagnose Prod Hosted Extractors

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Time Series Ingestion
    runs-on: ubuntu-latest
    environment: prod

    container:
      image: cognite/toolkit:0.6.53

    env:
      CDF_PROJECT: cdf-bootcamp-41-prod
      CDF_CLUSTER: westeurope-1
      IDP_TENANT_ID: 16e3985b-ebe8-4e24-9da4-933e21a9fc81
      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}

    steps:
      - name: Diagnose Time Series Job and Mapping
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import traceback
          from datetime import datetime, timezone

          from cognite.client import CogniteClient, ClientConfig
          from cognite.client.credentials import OAuthClientCredentials
          from cognite.client.config import global_config

          global_config.disable_pypi_version_check = True

          project = os.environ["CDF_PROJECT"]
          cluster = os.environ["CDF_CLUSTER"]
          tenant = os.environ["IDP_TENANT_ID"]
          base_url = f"https://{cluster}.cognitedata.com"

          credentials = OAuthClientCredentials(
              token_url=(
                  f"https://login.microsoftonline.com/"
                  f"{tenant}/oauth2/v2.0/token"
              ),
              client_id=os.environ["IDP_CLIENT_ID"],
              client_secret=os.environ["IDP_CLIENT_SECRET"],
              scopes=[f"{base_url}/.default"],
          )

          client = CogniteClient(
              ClientConfig(
                  client_name="prod-timeseries-diagnostics",
                  project=project,
                  credentials=credentials,
                  base_url=base_url,
              )
          )

          def section(title):
              print()
              print("=" * 60)
              print(title)
              print("=" * 60, flush=True)

          def format_time(ms):
              if ms is None:
                  return "N/A"
              return datetime.fromtimestamp(
                  ms / 1000, tz=timezone.utc
              ).isoformat()

          def check_job():
              section("TIME SERIES JOB STATUS")

              job = client.hosted_extractors.jobs.retrieve(
                  "ICAPI Time series"
              )

              print("JOB:", job.external_id)
              print("STATUS:", job.status)
              print("TARGET:", job.target_status)
              print("SOURCE:", job.source_id)
              print("DESTINATION:", job.destination_id)

              print("FORMAT:", job.format.dump())
              print("CONFIG:", job.config.dump())

          def check_logs():
              section("TIME SERIES JOB LOGS")

              logs = client.hosted_extractors.jobs.list_logs(
                  job="ICAPI Time series",
                  limit=10,
              )

              for log in logs:
                  print("TYPE:", log.type)
                  print(
                      "TIME:",
                      format_time(
                          getattr(log, "created_time", None)
                      ),
                  )
                  print("MESSAGE:", str(log.message or "")[:500])
                  print("-" * 40)

          def check_metrics():
              section("TIME SERIES JOB METRICS")

              metrics = client.hosted_extractors.jobs.list_metrics(
                  job="ICAPI Time series",
                  limit=5,
              )

              print("METRIC RECORDS:", len(metrics))

              for m in metrics:
                  print("TIME:", format_time(m.timestamp))
                  print("SOURCE MESSAGES:", m.source_messages)
                  print("CDF INPUT VALUES:", m.cdf_input_values)
                  print("CDF REQUESTS:", m.cdf_requests)
                  print(
                      "CDF SKIPPED VALUES:",
                      getattr(m, "cdf_skipped_values", "N/A"),
                  )
                  print(
                      "CDF UPLOADED VALUES:",
                      m.cdf_uploaded_values,
                  )
                  print(
                      "CDF FAILED VALUES:",
                      m.cdf_failed_values,
                  )
                  print(
                      "CDF WRITE FAILURES:",
                      m.cdf_write_failures,
                  )
                  print(
                      "TRANSFORM FAILURES:",
                      m.transform_failures,
                  )
                  print("-" * 40)

          def check_mapping():
              section("DEPLOYED TIME SERIES MAPPING")

              mapping = client.hosted_extractors.mappings.retrieve(
                  "ICAPI Time series"
              )

              print("MAPPING ID:", mapping.external_id)
              print("PUBLISHED:", mapping.published)
              print("INPUT:", mapping.input.dump())
              print("EXPRESSION:")
              print(mapping.mapping.expression)
              print(
                  "LAST UPDATED:",
                  format_time(mapping.last_updated_time),
              )

          section("PROD DIAGNOSTIC START")
          print("PROJECT:", project)
          print("CLUSTER:", cluster)

          checks = [
              check_job,
              check_logs,
              check_metrics,
              check_mapping,
          ]

          failures = 0

          for check in checks:
              try:
                  check()
              except Exception as error:
                  failures += 1
                  print("CHECK FAILED:", check.__name__)
                  print("ERROR TYPE:", type(error).__name__)
                  print("DETAIL:", str(error)[:500])
                  traceback.print_exc()

          section("DIAGNOSIS FINISHED")
          print("FAILED CHECKS:", failures)

          if failures:
              sys.exit(1)
          PY
