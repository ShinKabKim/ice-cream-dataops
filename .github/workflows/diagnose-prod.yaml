
name: Diagnose Prod Hosted Extractors

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Hosted Extractor Jobs
    runs-on: ubuntu-latest
    environment: prod

    container:
      image: cognite/toolkit:0.6.53

    env:
      CDF_PROJECT: cdf-bootcamp-41-prod
      CDF_CLUSTER: westeurope-1
      IDP_TENANT_ID: 16e3985b-ebe8-4e24-9da4-933e21a9fc81

      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}

      ICAPI_EXTRACTORS_CLIENT_ID: ${{ vars.ICAPI_EXTRACTORS_CLIENT_ID }}
      ICAPI_EXTRACTORS_CLIENT_SECRET: ${{ secrets.ICAPI_EXTRACTORS_CLIENT_SECRET }}

    steps:
      - name: Check Jobs Permissions and Destination Sessions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import traceback
          from datetime import datetime, timezone

          from cognite.client import CogniteClient, ClientConfig
          from cognite.client.credentials import OAuthClientCredentials
          from cognite.client.config import global_config

          global_config.disable_pypi_version_check = True

          PROJECT = os.environ["CDF_PROJECT"]
          CLUSTER = os.environ["CDF_CLUSTER"]
          TENANT = os.environ["IDP_TENANT_ID"]

          BASE_URL = f"https://{CLUSTER}.cognitedata.com"
          TOKEN_URL = (
              f"https://login.microsoftonline.com/"
              f"{TENANT}/oauth2/v2.0/token"
          )

          def section(title):
              print()
              print("=" * 60)
              print(title)
              print("=" * 60, flush=True)

          def create_client(client_id, client_secret, name):
              credentials = OAuthClientCredentials(
                  token_url=TOKEN_URL,
                  client_id=client_id,
                  client_secret=client_secret,
                  scopes=[f"{BASE_URL}/.default"],
              )

              config = ClientConfig(
                  client_name=name,
                  project=PROJECT,
                  credentials=credentials,
                  base_url=BASE_URL,
              )

              return CogniteClient(config)

          def format_time(milliseconds):
              if milliseconds is None:
                  return "N/A"

              return datetime.fromtimestamp(
                  milliseconds / 1000,
                  tz=timezone.utc,
              ).isoformat()

          def inspect_permissions(client):
              inspection = client.iam.token.inspect()

              print("Authentication: SUCCESS")
              print("Project:", PROJECT)

              relevant = {
                  "dataModelsAcl",
                  "dataModelInstancesAcl",
                  "rawAcl",
                  "timeSeriesAcl",
              }

              capabilities = inspection.dump().get(
                  "capabilities", []
              )

              found = set()

              def inspect_capability(item):
                  if isinstance(item, dict):
                      for key, value in item.items():
                          if key in relevant:
                              found.add(key)
                              print("CAPABILITY:", key)
                              print("SETTINGS:", value)

                          if isinstance(value, (dict, list)):
                              inspect_capability(value)

                  elif isinstance(item, list):
                      for value in item:
                          inspect_capability(value)

              inspect_capability(capabilities)

              for name in sorted(relevant - found):
                  print("NOT FOUND:", name)

              print("Permission inspection completed.")

          def inspect_jobs(client):
              section("HOSTED EXTRACTOR JOBS")

              jobs = client.hosted_extractors.jobs.list(
                  limit=100
              )

              for job in jobs:
                  print("JOB:", job.external_id)
                  print("STATUS:", job.status)
                  print("TARGET:", job.target_status)
                  print("SOURCE:", job.source_id)
                  print("DESTINATION:", job.destination_id)
                  print("-" * 40)

              return jobs

          def inspect_logs(client, jobs):
              section("RECENT JOB LOGS")

              for job in jobs:
                  print()
                  print("JOB:", job.external_id)

                  try:
                      logs = (
                          client.hosted_extractors.jobs.list_logs(
                              job=job.external_id,
                              limit=10,
                          )
                      )

                      for log in logs:
                          print("TYPE:", log.type)
                          print(
                              "TIME:",
                              format_time(
                                  getattr(log, "created_time", None)
                              ),
                          )
                          print(
                              "MESSAGE:",
                              str(log.message or "")[:500],
                          )
                          print("-" * 30)

                  except Exception as error:
                      print(
                          "LOG ERROR:",
                          type(error).__name__,
                          str(error)[:500],
                      )

          def inspect_destinations(client):
              section("DESTINATION SESSIONS")

              try:
                  destinations = (
                      client.hosted_extractors.destinations.list(
                          limit=100
                      )
                  )

                  for dest in destinations:
                      print(
                          "DESTINATION:",
                          dest.external_id,
                      )
                      print(
                          "SESSION ID:",
                          getattr(dest, "session_id", None),
                      )
                      print(
                          "LAST UPDATED:",
                          format_time(
                              getattr(
                                  dest,
                                  "last_updated_time",
                                  None,
                              )
                          ),
                      )
                      print(
                          "TARGET DATA SET ID:",
                          getattr(
                              dest,
                              "target_data_set_id",
                              None,
                          ),
                      )
                      print("-" * 40)

              except Exception as error:
                  print("DESTINATION CHECK FAILED")
                  print("ERROR TYPE:", type(error).__name__)
                  print("ERROR:", str(error)[:1000])

          def main():
              section("PROD DIAGNOSTIC START")

              print("PROJECT:", PROJECT)
              print("CLUSTER:", CLUSTER)

              admin_client = create_client(
                  os.environ["IDP_CLIENT_ID"],
                  os.environ["IDP_CLIENT_SECRET"],
                  "prod-admin-diagnostics",
              )

              extractor_client = create_client(
                  os.environ["ICAPI_EXTRACTORS_CLIENT_ID"],
                  os.environ["ICAPI_EXTRACTORS_CLIENT_SECRET"],
                  "prod-extractor-diagnostics",
              )

              section("EXTRACTOR SERVICE ACCOUNT PERMISSIONS")

              try:
                  inspect_permissions(extractor_client)
              except Exception as error:
                  print("PERMISSION CHECK FAILED")
                  print("ERROR TYPE:", type(error).__name__)
                  print("ERROR:", str(error)[:1000])

              jobs = inspect_jobs(admin_client)

              inspect_logs(admin_client, jobs)

              inspect_destinations(admin_client)

              section("DIAGNOSIS FINISHED")

          try:
              main()
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PY
