
name: Restart Prod Time Series Extractor

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select pause or resume"
        required: true
        type: choice
        options:
          - pause
          - resume

jobs:
  control:
    name: Control ICAPI Time series
    runs-on: ubuntu-latest
    environment: prod
    container:
      image: cognite/toolkit:0.6.53

    env:
      CDF_PROJECT: cdf-bootcamp-41-prod
      CDF_CLUSTER: westeurope-1
      IDP_TENANT_ID: 16e3985b-ebe8-4e24-9da4-933e21a9fc81
      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}
      JOB_ACTION: ${{ inputs.action }}

    steps:
      - name: Pause or resume Time Series Job
        shell: bash
        run: |
          python - <<'PY'
          import os
          from cognite.client import CogniteClient, ClientConfig
          from cognite.client.credentials import OAuthClientCredentials
          from cognite.client.data_classes.hosted_extractors import JobUpdate

          base_url = (
              f"https://{os.environ['CDF_CLUSTER']}.cognitedata.com"
          )

          credentials = OAuthClientCredentials(
              token_url=(
                  "https://login.microsoftonline.com/"
                  + os.environ["IDP_TENANT_ID"]
                  + "/oauth2/v2.0/token"
              ),
              client_id=os.environ["IDP_CLIENT_ID"],
              client_secret=os.environ["IDP_CLIENT_SECRET"],
              scopes=[f"{base_url}/.default"],
          )

          client = CogniteClient(
              ClientConfig(
                  client_name="prod-timeseries-control",
                  project=os.environ["CDF_PROJECT"],
                  credentials=credentials,
                  base_url=base_url,
              )
          )

          job_id = "ICAPI Time series"
          action = os.environ["JOB_ACTION"]
          target = {"pause": "paused", "resume": "running"}[action]

          before = client.hosted_extractors.jobs.retrieve(job_id)

          print("PROJECT:", client.config.project)
          print("JOB:", before.external_id)
          print("BEFORE STATUS:", before.status)
          print("BEFORE TARGET:", before.target_status)

          update = JobUpdate(external_id=job_id)
          update.target_status.set(target)

          result = client.hosted_extractors.jobs.update(update)

          print("REQUESTED TARGET:", target)
          print("AFTER STATUS:", result.status)
          print("AFTER TARGET:", result.target_status)
          print("UPDATE COMPLETED")
          PY
